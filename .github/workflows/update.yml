name: update formulas from the latest releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rewrite version, urls and sums from each tool's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tool in comparegraph personajury; do
            tag=$(gh release view --repo "MassRelayAI/$tool" --json tagName -q .tagName)
            curl -fsSL -o SHA256SUMS "https://github.com/MassRelayAI/$tool/releases/download/$tag/SHA256SUMS"
            f="Formula/$tool.rb"
            for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
              sum=$(grep -E "[[:space:]]\*?$tool-$p\$" SHA256SUMS | cut -d' ' -f1)
              [ -n "$sum" ] || { echo "no sum for $tool-$p in $tag"; exit 1; }
              python3 scripts/stamp.py "$tool" "$f" "$p" "$tag" "$sum"
            done
            rm SHA256SUMS
            if git diff --quiet -- "$f"; then echo "$tool already at $tag"; else git commit -m "$tool $tag" -- "$f"; fi
          done
          git push
