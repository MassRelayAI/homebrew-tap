name: install each formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['update formulas from the latest releases']
    types: [completed]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Tap this checkout, install, test, audit
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = Linux ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew tap massrelayai/tap "$GITHUB_WORKSPACE"
          for tool in comparegraph personajury; do
            brew install "massrelayai/tap/$tool"
            brew test "massrelayai/tap/$tool"
            brew audit --strict --formula "massrelayai/tap/$tool"
            "$tool" --version
          done
